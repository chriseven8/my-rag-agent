services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: my-rag-pgvector
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag123456
      POSTGRES_DB: rag_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
volumes:
  pgdata:
