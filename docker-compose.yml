services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: my-rag-pgvector
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag123456
      POSTGRES_DB: rag_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    # 让 `docker compose up -d --wait` 能真正阻塞到数据库可接受连接为止,
    # 否则脚本会在 PG 还没起来时就启动后端,报 "Connection refused 5433"。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag_db"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
volumes:
  pgdata:
